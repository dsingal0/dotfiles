# Ghostty config, symlinked to ~/.config/ghostty/config by brew-setup.sh.
# Only the local Mac terminal needs this: remote Ubuntu pods (via kubectl exec)
# render inside this terminal, so they inherit the same font.

# JetBrains Mono with Nerd Font glyphs so TUIs (droid, omp, etc.) render
# their icons. Plain text is still JetBrains Mono.
font-family = JetBrainsMono Nerd Font

# Wrap `ssh` in interactive shells to forward TERM/COLORTERM and install
# Ghostty's terminfo on remote hosts, so remote sessions get correct colors.
# (The wrapper is a shell function, so it does not cover git/rsync/scp.)
shell-integration-features = ssh-env,ssh-terminfo
