{"apiVersion":"v1","kind":"Pod","metadata":{"annotations":{},"labels":{"app":"dsingal-dev-pod-b300"},"name":"dsingal-dev-pod-b300","namespace":"default"},"spec":{"containers":[{"command":["/bin/bash","-c","set -euo pipefail\n\nHOST_PREFIX=\"/host\"\nMIN_HOST_FS_BYTES=$((100 * 1024 * 1024 * 1024))\nHOST_MAX_USED_PCT=\"${DEV_HOST_MAX_USED_PCT:-80}\"\nSTORAGE_DIR_NAME=\"baseten-dev-pods\"\nLEGACY_STORAGE_DIR_NAME=\".baseten-dev-pods\"\nMOUNT_MARKER=\"${HOST_PREFIX}/.baseten-dev-pod-mounts/${dsingal}\"\n\nhost_path_for() {\n  local mount_point=\"$1\"\n  if [[ \"${mount_point}\" == \"/\" ]]; then\n    printf '%s\\n' \"${HOST_PREFIX}\"\n  else\n    printf '%s\\n' \"${HOST_PREFIX}${mount_point}\"\n  fi\n}\n\nhost_mount_has_headroom() {\n  local host_path=\"$1\"\n  local used_pct\n\n  used_pct=\"$(df -B1 -P \"${host_path}\" 2\u003e/dev/null | awk 'NR==2 {gsub(/%/,\"\",$5); print $5}')\"\n  [[ -n \"${used_pct}\" ]] || return 1\n  (( used_pct \u003c HOST_MAX_USED_PCT ))\n}\n\nworkspace_path_on() {\n  local host_path=\"$1\"\n  if [[ -d \"${host_path}/${STORAGE_DIR_NAME}/${dsingal}\" ]]; then\n    printf '%s\\n' \"${host_path}/${STORAGE_DIR_NAME}/${dsingal}\"\n    return 0\n  fi\n  if [[ -d \"${host_path}/${LEGACY_STORAGE_DIR_NAME}/${dsingal}\" ]]; then\n    printf '%s\\n' \"${host_path}/${LEGACY_STORAGE_DIR_NAME}/${dsingal}\"\n    return 0\n  fi\n  return 1\n}\n\n# Host-relative mount points (/ or /mnt, ...) that are real block filesystems.\neach_candidate_mount_point() {\n  local mnt src fstype host_mnt host_path\n\n  while IFS= read -r mnt; do\n    [[ -n \"${mnt}\" ]] || continue\n    [[ \"${mnt}\" == /proc* || \"${mnt}\" == /sys* || \"${mnt}\" == /dev* || \"${mnt}\" == /run* ]] \u0026\u0026 continue\n\n    # Strip /host prefix from mount points (container bind mounts show as /host/...)\n    if [[ \"${mnt}\" == \"${HOST_PREFIX}\" ]]; then\n      host_mnt=\"/\"\n    elif [[ \"${mnt}\" == \"${HOST_PREFIX}\"/* ]]; then\n      host_mnt=\"${mnt#${HOST_PREFIX}}\"\n    else\n      host_mnt=\"${mnt}\"\n    fi\n    [[ \"${host_mnt}\" == /proc* || \"${host_mnt}\" == /sys* || \"${host_mnt}\" == /dev* || \"${host_mnt}\" == /run* ]] \u0026\u0026 continue\n\n    IFS=' ' read -r src fstype _ \u003c \u003c(awk -v mnt=\"${mnt}\" '$2 == mnt {print $1, $3; exit}' \"${HOST_PREFIX}/proc/mounts\")\n    [[ -n \"${src}\" ]] || continue\n    [[ \"${src}\" == /dev/* || \"${fstype}\" == ext4 || \"${fstype}\" == xfs || \"${fstype}\" == btrfs ]] || continue\n    [[ \"${fstype}\" != tmpfs \u0026\u0026 \"${fstype}\" != overlay \u0026\u0026 \"${fstype}\" != devtmpfs \u0026\u0026 \"${fstype}\" != efivarfs ]] || continue\n\n    host_path=\"$(host_path_for \"${host_mnt}\")\"\n    [[ -d \"${host_path}\" ]] || continue\n    printf '%s\\n' \"${host_mnt}\"\n  done \u003c \u003c(awk '{print $2}' \"${HOST_PREFIX}/proc/mounts\" | sort -u)\n}\n\nfind_best_host_mount() {\n  local best=\"\" best_avail=0\n  local host_path avail total host_mnt\n\n  while IFS= read -r host_mnt; do\n    host_path=\"$(host_path_for \"${host_mnt}\")\"\n    read -r total avail \u003c \u003c(df -B1 -P \"${host_path}\" 2\u003e/dev/null | awk 'NR==2{print $2, $4}')\n    [[ -n \"${total}\" \u0026\u0026 -n \"${avail}\" ]] || continue\n    (( total \u003e= MIN_HOST_FS_BYTES )) || continue\n    host_mount_has_headroom \"${host_path}\" || continue\n    (( avail \u003e best_avail )) || continue\n\n    best_avail=\"${avail}\"\n    best=\"${host_mnt}\"\n  done \u003c \u003c(each_candidate_mount_point)\n\n  if [[ -z \"${best}\" ]]; then\n    echo \"ERROR: could not find a suitable host block filesystem under ${HOST_PREFIX}\" \u003e\u00262\n    exit 1\n  fi\n  printf '%s\\n' \"${best}\"\n}\n\npersist_mount_marker() {\n  local mount_point=\"$1\"\n  mkdir -p \"$(dirname \"${MOUNT_MARKER}\")\"\n  printf '%s\\n' \"${mount_point}\" \u003e \"${MOUNT_MARKER}\"\n}\n\nselect_host_mount() {\n  local mount_point host_path ws sz\n  local best=\"\" best_sz=-1\n\n  # Never create a second workspace. If one already exists on any\n  # candidate disk, reuse the largest — even when that disk is at or\n  # above HOST_MAX_USED_PCT. Requiring headroom here switched /root\n  # onto a new empty disk after a liveness restart and hid /root/repos.\n  while IFS= read -r mount_point; do\n    host_path=\"$(host_path_for \"${mount_point}\")\"\n    ws=\"$(workspace_path_on \"${host_path}\" || true)\"\n    [[ -n \"${ws}\" ]] || continue\n    sz=\"$(du -s -B1 \"${ws}\" 2\u003e/dev/null | awk '{print $1}')\"\n    [[ -n \"${sz}\" ]] || sz=0\n    if (( sz \u003e best_sz )); then\n      best_sz=\"${sz}\"\n      best=\"${mount_point}\"\n    fi\n  done \u003c \u003c(each_candidate_mount_point)\n\n  if [[ -n \"${best}\" ]]; then\n    host_path=\"$(host_path_for \"${best}\")\"\n    if ! host_mount_has_headroom \"${host_path}\"; then\n      echo \"WARNING: reusing existing workspace on ${best} even though it is at or above ${HOST_MAX_USED_PCT}% used; not switching disks\" \u003e\u00262\n    else\n      echo \"Reusing existing workspace on ${best}\" \u003e\u00262\n    fi\n    persist_mount_marker \"${best}\"\n    printf '%s\\n' \"${best}\"\n    return\n  fi\n\n  mount_point=\"$(find_best_host_mount)\"\n  persist_mount_marker \"${mount_point}\"\n  printf '%s\\n' \"${mount_point}\"\n}\n\nsetup_dev_storage() {\n  local mount_point=\"$1\"\n  local rel_base storage_base legacy_storage_base host_storage_root host_df_path\n\n  if [[ \"${mount_point}\" == \"/\" ]]; then\n    host_storage_root=\"${HOST_PREFIX}\"\n    host_df_path=\"${HOST_PREFIX}\"\n  else\n    host_storage_root=\"${HOST_PREFIX}${mount_point}\"\n    host_df_path=\"${HOST_PREFIX}${mount_point}\"\n  fi\n\n  if [[ \"${mount_point}\" == \"/\" ]]; then\n    rel_base=\"/${STORAGE_DIR_NAME}/${dsingal}\"\n  else\n    rel_base=\"${mount_point}/${STORAGE_DIR_NAME}/${dsingal}\"\n  fi\n  storage_base=\"${host_storage_root}/${STORAGE_DIR_NAME}/${dsingal}\"\n  legacy_storage_base=\"${host_storage_root}/${LEGACY_STORAGE_DIR_NAME}/${dsingal}\"\n  if [[ -d \"${legacy_storage_base}\" ]]; then\n    if [[ -e \"${storage_base}\" || -L \"${storage_base}\" ]]; then\n      echo \"ERROR: both legacy and current storage paths exist; refusing to merge them\"\n      printf 'Legacy: %s\\nCurrent: %s\\n' \"${legacy_storage_base}\" \"${storage_base}\"\n      exit 1\n    fi\n    mkdir -p \"$(dirname \"${storage_base}\")\"\n    mv -- \"${legacy_storage_base}\" \"${storage_base}\"\n    rmdir \"$(dirname \"${legacy_storage_base}\")\" 2\u003e/dev/null || true\n    echo \"Migrated workspace to ${storage_base}\"\n  fi\n\n  mkdir -p \"${storage_base}/root\" \"${storage_base}/docker\" \"${storage_base}/tmp\"\n  mount --bind \"${storage_base}/root\" /root\n  mount --bind \"${storage_base}/docker\" /var/lib/docker\n  mount --bind \"${storage_base}/tmp\" /tmp\n  chmod 1777 /tmp\n\n  printf '%s\\n' \"${rel_base}\" \u003e /run/dev-storage-base\n  printf '%s\\n' \"${host_df_path}\" \u003e /run/dev-host-mount\n  echo \"Dev storage: bind ${rel_base} on host ${mount_point}\"\n  echo \"Host guard: liveness kicks this pod if ${mount_point} reaches ${HOST_MAX_USED_PCT}% used\"\n  df -h /root /var/lib/docker /tmp \"${host_df_path}\"\n}\n\nBEST_MOUNT=\"$(select_host_mount)\"\necho \"Selected host mount for workspace: ${BEST_MOUNT}\"\nsetup_dev_storage \"${BEST_MOUNT}\"\n\nNODE_STORAGE=\"/root\"\nCACHE_DIR=\"${NODE_STORAGE}/.cache\"\nmkdir -p \"${CACHE_DIR}/bin\" \"${CACHE_DIR}/huggingface\" \"${CACHE_DIR}/torch\" \"${CACHE_DIR}/pip\" /run /var/run\nexport PATH=\"${CACHE_DIR}/bin:/usr/local/bin:${PATH}\"\n# Keep large caches off the container overlay (small root disk).\nexport HOME=/root\nexport TMPDIR=/tmp\nexport XDG_CACHE_HOME=\"${CACHE_DIR}\"\nexport HF_HOME=\"${CACHE_DIR}/huggingface\"\nexport HUGGINGFACE_HUB_CACHE=\"${CACHE_DIR}/huggingface\"\nexport TORCH_HOME=\"${CACHE_DIR}/torch\"\nexport PIP_CACHE_DIR=\"${CACHE_DIR}/pip\"\n\n# --- bash history ---\nmkdir -p \"${CACHE_DIR}\"\ntouch \"${CACHE_DIR}/.bash_history\"\nln -sf \"${CACHE_DIR}/.bash_history\" /root/.bash_history\n\n# --- vscode server ---\nmkdir -p \"${NODE_STORAGE}/vscode-server\"\nln -sfn \"${NODE_STORAGE}/vscode-server\" /root/.vscode-server\n\necho \"Mounted storage overview:\"\ndf -h \"${NODE_STORAGE}\" /var/lib/docker /tmp 2\u003e/dev/null || true\n\n# Workspace + Docker data live on the largest host disk via bind mounts.\n# Running dockerd inside the pod makes bind mounts against /root resolve here.\nif command -v dockerd \u003e/dev/null 2\u003e\u00261 \u0026\u0026 ! docker info \u003e/dev/null 2\u003e\u00261; then\n  nohup dockerd --host=unix:///var/run/docker.sock --data-root=/var/lib/docker --iptables=false \u003e/tmp/dockerd.log 2\u003e\u00261 \u0026\n  for i in $(seq 1 60); do\n    docker info \u003e/dev/null 2\u003e\u00261 \u0026\u0026 break\n    sleep 2\n  done\nfi\n\nif ! docker info \u003e/dev/null 2\u003e\u00261; then\n  echo \"WARNING: docker daemon not ready; pod kept alive for inspection\"\n  tail -100 /tmp/dockerd.log || true\nfi\n\n# --- dotfiles ---\nif [[ ! -d /root/dotfiles ]]; then\n  git clone https://github.com/dsingal0/dotfiles /root/dotfiles || echo \"WARNING: failed to clone dotfiles\"\nfi\nif [[ -x /root/dotfiles/setup.sh ]]; then\n  /root/dotfiles/setup.sh || echo \"WARNING: dotfiles setup.sh failed\"\nfi\n\ntouch /tmp/pod-ready\nsleep infinity\n"],"env":[{"name":"dsingal","value":"dsingal"},{"name":"DEV_HOST_MAX_USED_PCT","value":"80"}],"image":"baseten/dsingaltest:gpudev-v1","imagePullPolicy":"IfNotPresent","lifecycle":{"preStop":{"exec":{"command":["/bin/bash","-c","# Liveness failures also run this hook. Never delete workspace\n# or Docker data during an automatic container restart.\necho \"preStop: syncing workspace; preserving all data\"\nsync\n"]}}},"livenessProbe":{"exec":{"command":["/bin/bash","-c","set -euo pipefail\nhost_mount=\"$(cat /run/dev-host-mount)\"\nmax_used_pct=\"${DEV_HOST_MAX_USED_PCT:-80}\"\n\n# Kick this pod before the host filesystem reaches kubelet's hard\n# eviction thresholds (imagefs.available\u003c15%, nodefs.available\u003c10%),\n# so this workspace never pushes the node into DiskPressure.\nused_pct=\"$(df -B1 -P \"${host_mount}\" | awk 'NR==2 {gsub(/%/,\"\",$5); print $5}')\"\nif [[ \"${used_pct}\" -ge \"${max_used_pct}\" ]]; then\n  echo \"host ${host_mount} at ${used_pct}% used (\u003e= ${max_used_pct}%); failing liveness to avoid DiskPressure\"\n  exit 1\nfi\nexit 0\n"]},"failureThreshold":2,"periodSeconds":30,"timeoutSeconds":120},"name":"dsingal-dev-pod-b300","readinessProbe":{"exec":{"command":["true"]},"failureThreshold":1,"periodSeconds":5},"resources":{"limits":{"nvidia.com/gpu":8},"requests":{"cpu":"10000m","ephemeral-storage":"20Gi","memory":"2200320Mi","nvidia.com/gpu":8}},"securityContext":{"capabilities":{"add":["IPC_LOCK","SYS_ADMIN"]},"privileged":true},"startupProbe":{"exec":{"command":["/bin/bash","-c","test -f /run/dev-host-mount"]},"failureThreshold":60,"periodSeconds":10,"timeoutSeconds":5},"volumeMounts":[{"mountPath":"/host","name":"host-fs"},{"mountPath":"/dev/shm","name":"dev-shm"}]}],"hostNetwork":true,"hostPID":true,"nodeSelector":{"baseten.co/gpu-type":"nvidia-b300"},"restartPolicy":"Always","runtimeClassName":"nvidia","securityContext":{"runAsUser":0},"terminationGracePeriodSeconds":30,"tolerations":[{"effect":"NoSchedule","key":"nvidia.com/gpu","operator":"Exists"},{"effect":"NoSchedule","key":"node.kubernetes.io/disk-pressure","operator":"Exists"},{"effect":"NoSchedule","key":"node.kubernetes.io/network-unavailable","operator":"Exists"},{"effect":"NoSchedule","key":"baseten-internal/customer-reservation","operator":"Equal","value":"dhruv--singal--baseten--co"}],"volumes":[{"hostPath":{"path":"/","type":"Directory"},"name":"host-fs"},{"emptyDir":{"medium":"Memory","sizeLimit":"8Gi"},"name":"dev-shm"}]}}
