# tmux config tuned for running TUI agents (Droid, Claude Code, omp)
# inside tmux, including over SSH to remote dev pods. Kept intentionally minimal.

# Enable mouse support so tmux forwards wheel events to TUI apps (like Droid)
# that enable mouse tracking. Without this, the terminal emulator translates
# scroll events to arrow keys in the alternate screen, breaking scrolling in
# Droid and similar TUI apps (Claude Code, etc.) inside tmux.
set -g mouse on

# Extended keys for proper keyboard input in TUI apps
# (e.g., Shift+Enter in Droid, Claude Code, omp). CSI-u format requires
# tmux 3.3+; the apt-shipped 3.2a lacks the option, so guard it with a version
# check to avoid "invalid option: extended-keys-format" at config load.
set -g extended-keys always
if-shell 'tmux -V | awk -F"[. ]" "NR==1{exit !(\$2>3 || (\$2==3 && \$3>=3))}"' \
  'set -g extended-keys-format csi-u'
set -as terminal-features 'xterm*:extkeys'

# 256-color terminal and true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# Eliminate escape delay for responsive modal editors (vim, etc.)
set -sg escape-time 0

# Forward focus/blur events to the inner program. Editors and TUIs use this to
# auto-save, refresh file watchers, and pause rendering when blurred.
set -g focus-events on

# Larger scrollback so long agent transcripts stay reachable in copy mode.
set -g history-limit 100000

# Close a gap when a mid-session window is closed (keeps window numbers compact).
set -g renumber-windows on

# OSC 52 clipboard passthrough: lets copy-mode / TUI copies reach the *local*
# clipboard over an SSH connection, instead of vanishing on the remote host.
set -g set-clipboard on
set -ag terminal-features ',xterm-ghostty:Ms=\\E]52;c;%p2%s\\7'

# Keep status messages visible a bit longer than the 750ms default.
set -g display-time 3000
