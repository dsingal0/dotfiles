# Enable mouse support so tmux forwards wheel events to TUI apps (like Droid)
# that enable mouse tracking. Without this, the terminal emulator translates
# scroll events to arrow keys in the alternate screen, breaking scrolling in
# Droid and similar TUI apps (Claude Code, Codex, etc.) inside tmux.
set -g mouse on

# Extended keys in CSI-u format for proper keyboard input in TUI apps
# (e.g., Shift+Enter in Droid, Claude Code, opencode).
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# 256-color terminal and true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# Eliminate escape delay for responsive modal editors (vim, etc.)
set -sg escape-time 0
